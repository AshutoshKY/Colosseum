# AWS Bedrock (us-east-1) via short-lived bearer token (AWS_BEARER_TOKEN_BEDROCK) or IAM credentials.
#
# GROUND TRUTH: entries below reflect AWS Bedrock foundation models and cross-region inference profiles
# available in us-east-1.
#
# INVOCATION MODES (why some ids carry a region prefix):
#   * Most open-weight / partner models (Qwen, Gemma, GPT-OSS, Mistral, DeepSeek, GLM, MiniMax,
#     Nemotron, Kimi, Llama, legacy Claude 3 Haiku) are on-demand callable by their BARE model id.
#   * Amazon Nova and Anthropic Claude models in US regions use "us." cross-region inference profiles —
#     bare model IDs return "on-demand throughput isn't supported. Retry with an inference profile".
#   * Newest models (Nova 2, Claude Opus 4.5) are callable via "global." or "us." inference profiles.
#
# TRANSPORT: LiteLLM `bedrock/<id>` with api_key=AWS_BEARER_TOKEN_BEDROCK, aws_region_name=us-east-1.
# The Converse route is used (LiteLLM picks it); vision models take images, PDFs are rasterized.
# Token is a short-lived STS-backed bearer (~12 h); verify_bedrock.py is the liveness probe.

family: bedrock
provider: bedrock
access: maas
defaults:
  modalities: [text]
  pdf_native: false
  vision: false
  max_image_mb: 10
  max_payload_mb: 25
  structured_method: json_mode
  needs_repair_fallback: true
  thinking: false
  enabled: true
  verified: true
  reason: null
  notes: "Bedrock us-east-1; PDFs are rasterized to images; bearer token expires ~12h (refresh AWS_BEARER_TOKEN_BEDROCK)."

