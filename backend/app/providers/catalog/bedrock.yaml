# AWS Bedrock (ap-south-1) via short-lived bearer token (AWS_BEARER_TOKEN_BEDROCK).
#
# GROUND TRUTH: entries below were live-probed against this account's Bedrock runtime
# (bedrock-runtime.ap-south-1.amazonaws.com /model/<id>/converse) on 2026-07-13. Every model
# here returned either 200 or 429 ("too many tokens per day" = authenticated + model id valid,
# just quota-limited) — i.e. it is CALLABLE. Models that returned 400 "invalid id",
# 403 "not available for this account", or that lack an on-demand inference profile are NOT
# listed (see the DISABLED block at the bottom for the notable exclusions and why).
#
# INVOCATION MODES (why some ids carry a region prefix):
#   * Most open-weight / partner models (Qwen, Gemma, GPT-OSS, Mistral, DeepSeek, GLM, MiniMax,
#     Nemotron, Kimi, Llama3, legacy Claude 3) are on-demand callable by their BARE model id.
#   * Amazon Nova (v1) and legacy Anthropic Claude (3.5 / 3.7 / Sonnet-4) are on-demand ONLY via
#     an "apac." cross-region inference profile — the bare id returns
#     "on-demand throughput isn't supported. Retry with an inference profile".
#   * Newest models (Nova 2, Claude Opus 4.5) are callable ONLY via a "global." profile.
#   The account's 13 inference profiles were enumerated from /inference-profiles; the transport
#   id below uses whichever prefix the account actually exposes.
#
# TRANSPORT: LiteLLM `bedrock/<id>` with api_key=AWS_BEARER_TOKEN_BEDROCK, aws_region_name.
# The Converse route is used (LiteLLM picks it); vision models take images, PDFs are rasterized.
# Token is a short-lived STS-backed bearer (~12 h); verify_bedrock.py is the liveness probe.

family: bedrock
provider: bedrock
access: maas
defaults:
  modalities: [text]
  pdf_native: false
  vision: false
  max_image_mb: 10
  max_payload_mb: 25
  structured_method: json_mode
  needs_repair_fallback: true
  thinking: false
  enabled: true
  verified: true
  reason: null
  notes: "Live-probed callable in ap-south-1 on 2026-07-13; PDFs are rasterized to images; bearer token expires ~12h (refresh AWS_BEARER_TOKEN_BEDROCK)."

