# Mistral on Vertex AI Model Garden (vertex_partner / MaaS).
# Small 3.1 / Medium 3 are multimodal (vision via images); Large / Nemo / Codestral are
# text-only; Mistral OCR is a dedicated document-OCR (vision) model. PDF via rasterized
# images (not native). json_mode + repair ladder.
#
# GATED OFF: not verified callable on vertex-internal-testing (no gcloud).

family: mistral
provider: vertex_partner
access: maas
defaults:
  modalities: [text]
  pdf_native: false
  vision: false
  structured_method: json_mode
  needs_repair_fallback: true
  thinking: false
  context_window: 128000
  enabled: false
  verified: false
  reason: "not verified callable on project (Mistral Model Garden enablement unconfirmed; no gcloud)"
  notes: "PDF via rasterized images for vision members; json_mode + repair."

models:
  - model_id: vertex_ai/mistral-small-2503
    display_name: Mistral Small 3.1 (Vertex)
    version: "small-2503"
    variant: vision
    modalities: [text, image]
    vision: true
    release_date: "2025-03-15"
    pricing_ref: mistral-small
  - model_id: vertex_ai/mistral-medium-3
    display_name: Mistral Medium 3 (Vertex)
