# GLM (Zhipu / z.ai) — available BOTH on Vertex Model Garden MaaS (vertex_partner) AND on
# the external z.ai OpenAI-compatible API. We register the Vertex MaaS members (routable via
# existing Vertex creds, gated until verified) and the external z.ai members (gated until a
# key is supplied — we only have Vertex + Langfuse creds now).
#
# GLM base members are treated text-only here (the -V vision members are separate); SO
# reliability via json_mode + repair ladder until verified.

family: glm

groups:
  # ---- Vertex Model Garden MaaS ----
  - provider: vertex_partner
    access: maas
    defaults:
      modalities: [text]
      pdf_native: false
      vision: false
      structured_method: json_mode
      needs_repair_fallback: true
      thinking: true
      context_window: 200000
      enabled: false
      verified: false
      reason: "not verified callable on project (GLM Model Garden enablement unconfirmed; no gcloud)"
      notes: "GLM thinking-capable; treated text-only (vision via separate -V members)."
    models:
      - model_id: vertex_ai/zai-org/glm-5-maas
        display_name: GLM-5 (Vertex)
        version: "5"
        variant: thinking
        pricing_ref: glm-5
      - model_id: vertex_ai/zai-org/glm-4.7-maas
        display_name: GLM-4.7 (Vertex)
        version: "4.7"
        variant: thinking
        pricing_ref: glm-4.7

  # ---- External z.ai OpenAI-compatible (no key yet) ----
  - provider: openai_compatible
    access: maas
    defaults:
      modalities: [text]
      pdf_native: false
      vision: false
      structured_method: json_mode
      needs_repair_fallback: true
      thinking: true
      context_window: 200000
      enabled: false
      verified: false
      reason: "no API key for z.ai external endpoint (only Vertex + Langfuse creds present)"
    models:
      - model_id: openai_compatible/zai/glm-5
        display_name: GLM-5 (z.ai)
        version: "5"
        variant: thinking
        pricing_ref: glm-5
      - model_id: openai_compatible/zai/glm-4.7
        display_name: GLM-4.7 (z.ai)
        version: "4.7"
        variant: thinking
        pricing_ref: glm-4.7
      - model_id: openai_compatible/zai/glm-4.6
        display_name: GLM-4.6 (z.ai)
        version: "4.6"
        variant: thinking
        pricing_ref: glm-4.6
      # vision-language member (external)
      - model_id: openai_compatible/zai/glm-4.6v
        display_name: GLM-4.6V (z.ai, vision)
        version: "4.6"
        variant: vision
        modalities: [text, image]
        vision: true
        pricing_ref: glm-4.6
        notes: "vision-language member; PDF via rasterized images."
