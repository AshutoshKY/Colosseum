# Claude (Anthropic) on Vertex AI Model Garden (vertex_partner / MaaS).
# Full vision + native PDF + prompt caching + tool-use + citations. Structured output via
# TOOLS mode (Instructor). Regional/multi-region endpoints add ~10% over global pricing —
# recorded per-run via run_result.endpoint for fair cost comparison.
#
# GATED OFF: not verified callable on vertex-internal-testing. Anthropic MaaS models require
# per-model Model Garden acceptance; we cannot confirm via gcloud here. The live smoke flips
# verified=true for any that actually answer.

family: claude
provider: vertex_partner
access: maas
defaults:
  modalities: [text, image, pdf]
  pdf_native: true
  vision: true
  max_payload_mb: 30.0
  context_window: 200000
  structured_method: tools
  thinking: true
  caching: true
  batch: true
  enabled: false
  verified: false
  reason: "not verified callable on project (Anthropic Model Garden acceptance unconfirmed; no gcloud)"
  notes: "+10% regional/multi-region premium; record endpoint for fair cost compare."

