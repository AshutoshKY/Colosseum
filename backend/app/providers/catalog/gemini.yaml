# Gemini on Vertex AI (vertex_ai / MaaS) — the only VERIFIED + ENABLED family for this
# project's Vertex (vertex-internal-testing). Native PDF, vision, json_schema structured
# output, ~1M context, thinking levels/budget + context caching. 30 MB Vertex payload cap.
#
# Schema notes (shared by every catalog file):
#   family/version/variant   -> grouping keys (variant captures thinking vs non-thinking etc.)
#   provider                 -> vertex_ai | vertex_partner | xai | openai_compatible
#   access                   -> maas | self_deploy
#   modalities               -> text/image/pdf/audio/video
#   pdf_native, vision       -> document handling
#   structured_method        -> json_schema | json_mode | tools
#   thinking                 -> reasoning budget/level supported (billed)
#   enabled / verified       -> enabled ONLY if verified callable on THIS project (or has a key)
#   reason                   -> why a model is gated off (enabled=false)
#   pricing_ref              -> key into providers/pricing/rate_card.json

family: gemini
provider: vertex_ai
access: maas
defaults:
  modalities: [text, image, pdf]
  pdf_native: true
  vision: true
  max_payload_mb: 30.0
  context_window: 1000000
  structured_method: json_schema
  thinking: true
  caching: true
  batch: true
  enabled: true
  verified: true
  notes: "VERIFIED June 2026 on vertex-internal-testing: native PDF, vision, json_schema, thinking, caching. 30 MB payload cap."

