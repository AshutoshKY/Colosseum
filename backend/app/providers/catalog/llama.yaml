# Llama (Meta) on Vertex AI Model Garden (vertex_partner / MaaS).
# Llama 4 (Scout/Maverick) and Llama 3.2-90B-Vision are multimodal; Llama 3.1 / 3 instruct
# are text-only. PDF via rasterized images for the vision members. json_mode + repair ladder.
#
# GATED OFF: not verified callable on vertex-internal-testing (no gcloud).

family: llama
provider: vertex_partner
access: maas
defaults:
  modalities: [text]
  pdf_native: false
  vision: false
  structured_method: json_mode
  needs_repair_fallback: true
  thinking: false
  context_window: 128000
  enabled: false
  verified: false
  reason: "not verified callable on project (Llama Model Garden enablement unconfirmed; no gcloud)"
  notes: "PDF via rasterized images for vision members; json_mode + repair."

models:
  # --- Llama 4 (multimodal) ---
  - model_id: vertex_ai/meta/llama-4-scout-17b-16e-instruct-maas
    display_name: Llama 4 Scout 17B 16E (Vertex)
    version: "4-scout"
    variant: vision
    modalities: [text, image]
    vision: true
    context_window: 10000000
    pricing_ref: llama-4-scout
  - model_id: vertex_ai/meta/llama-4-scout-17b-128e-instruct-maas
    display_name: Llama 4 Scout 17B 128E (Vertex)
    version: "4-scout-128e"
    variant: vision
    modalities: [text, image]
    vision: true
    context_window: 10000000
    pricing_ref: llama-4-scout
  - model_id: vertex_ai/meta/llama-4-maverick-17b-128e-instruct-maas
    display_name: Llama 4 Maverick 17B 128E (Vertex)
    version: "4-maverick"
    variant: vision
    modalities: [text, image]
    vision: true
    context_window: 1000000
    pricing_ref: llama-4-maverick
  - model_id: vertex_ai/meta/llama-4-maverick-17b-16e-instruct-maas
    display_name: Llama 4 Maverick 17B 16E (Vertex)
    version: "4-maverick-16e"
