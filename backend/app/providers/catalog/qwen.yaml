# Qwen3 on Vertex AI Model Garden (vertex_partner / MaaS).
# The MaaS members listed in Model Garden are TEXT-ONLY (instruct / thinking / coder); the
# VL (vision-language) variants are self-deploy only and not exposed as MaaS here. So the
# Vertex Qwen members are gated out of image/PDF tasks by the capability gate. Thinking vs
# non-thinking are FIRST-CLASS separate configs (qwen3-next exposes both).
#
# GATED OFF: not verified callable on vertex-internal-testing (no gcloud).

family: qwen
provider: vertex_partner
access: maas
defaults:
  modalities: [text]
  pdf_native: false
  vision: false
  structured_method: json_mode
  needs_repair_fallback: true
  thinking: false
  context_window: 262144
  enabled: false
  verified: false
  reason: "not verified callable on project (Qwen Model Garden enablement unconfirmed; no gcloud)"
  notes: "Vertex Qwen3 MaaS members are text-only; VL variants are self-deploy. Gate out of image tasks."

models:
  - model_id: vertex_ai/qwen/qwen3-235b-a22b-instruct-2507-maas
    display_name: Qwen3 235B A22B Instruct (Vertex)
    version: "3-235b"
    variant: instruct
    release_date: "2025-07-20"
    pricing_ref: qwen3
    enabled: true
    verified: true
    reason: null
    notes: "VERIFIED callable on vertex-internal-testing (Phase 2.5 live probe, June 2026). Text-only: gated out of image/PDF tasks; json_mode + repair ladder."
  - model_id: vertex_ai/qwen/qwen3-coder-480b-a35b-instruct-maas
    display_name: Qwen3 Coder 480B A35B (Vertex)
    version: "3-coder-480b"
    variant: instruct
    release_date: "2025-07-20"
    pricing_ref: qwen3-coder
    enabled: true
    verified: true
    reason: null
    notes: "VERIFIED callable on vertex-internal-testing (July 2026). Text-only: gated out of image/PDF tasks; json_mode (MD_JSON) + repair ladder."
  - model_id: vertex_ai/qwen/qwen3-next-80b-a3b-instruct-maas
    display_name: Qwen3 Next 80B A3B Instruct (Vertex)
    version: "3-next-80b"
    variant: instruct
    release_date: "2025-07-20"
    pricing_ref: qwen3
    enabled: true
    verified: true
    reason: null
    notes: "VERIFIED callable on vertex-internal-testing (July 2026). Text-only: gated out of image/PDF tasks; json_mode (MD_JSON) + repair ladder."
  # thinking variant of the same base — first-class separate config.
  - model_id: vertex_ai/qwen/qwen3-next-80b-a3b-thinking-maas
    display_name: Qwen3 Next 80B A3B Thinking (Vertex)
    version: "3-next-80b"
    variant: thinking
    thinking: true
    release_date: "2025-07-20"
    pricing_ref: qwen3
    enabled: true
    verified: true
    reason: null
    notes: "VERIFIED callable on vertex-internal-testing (July 2026). Text-only: gated out of image/PDF tasks; json_mode (MD_JSON) + repair ladder."

  # --- Qwen 2.5 on Vertex ---
  - model_id: vertex_ai/qwen/qwen2.5-72b-instruct-maas
    display_name: Qwen 2.5 72B Instruct (Vertex)
    version: "2.5-72b"
    variant: instruct
    release_date: "2024-09-19"
    pricing_ref: qwen-2.5
    notes: "Text-only: gated out of image/PDF tasks; json_mode (MD_JSON) + repair ladder."
  - model_id: vertex_ai/qwen/qwen2.5-coder-32b-instruct-maas
    display_name: Qwen 2.5 Coder 32B (Vertex)
    version: "2.5-coder-32b"
    variant: instruct
    release_date: "2024-11-12"
    pricing_ref: qwen-2.5-coder
    notes: "Text-only: gated out of image/PDF tasks; json_mode (MD_JSON) + repair ladder."
  - model_id: vertex_ai/qwen/qwen2.5-7b-instruct-maas
    display_name: Qwen 2.5 7B Instruct (Vertex)
    version: "2.5-7b"
    variant: instruct
    release_date: "2024-09-19"
    pricing_ref: qwen-2.5
    notes: "Text-only: gated out of image/PDF tasks; json_mode (MD_JSON) + repair ladder."
  - model_id: vertex_ai/qwen/qwq-32b-preview-maas
    display_name: QwQ 32B Preview (Vertex)
    version: "qwq-32b"
    variant: thinking
    thinking: true
    release_date: "2024-11-28"
    pricing_ref: qwen-2.5
    notes: "Reasoning model; text-only: gated out of image/PDF tasks."

  # Self-deployed vLLM endpoint. Provider/access override the Vertex group defaults.
  - model_id: qwen3-vl-8b
    litellm_model: openai/Qwen/Qwen3-VL-8B-Instruct
    display_name: Qwen3-VL-8B Instruct (self-deployed)
    provider: openai_compatible
    access: self_deploy
    version: "3-vl-8b"
    variant: vision
    release_date: "2025-06-15"
    base_url_env: QWEN_VL_BASE_URL
    api_key_env: QWEN_VL_API_KEY
    modalities: [text, image]
    pdf_native: false
    vision: true
    max_image_mb: 10
    max_payload_mb: 25
    # Self-deployed vLLM serves this with max_model_len=26032. A full-resolution scanned page
    # (e.g. 5390x5590 ~30 MP) alone tokenizes to ~38k vision tokens — larger than the whole
    # context window — which makes the endpoint hang (observed as TimeoutError). Cap each page
    # at ~4 MP (~5k vision tokens) so a multi-page packet + prompt + output fits under 26k.
    max_image_megapixels: 4.0
    context_window: 26032
    structured_method: json_mode
    needs_repair_fallback: true
    thinking: false
    pricing_ref: self_deploy_qwen3_vl_8b
    enabled: true
    verified: true
    reason: null
    notes: "Self-deployed vLLM (max_model_len 26032); rasterized pages capped at 4 MP so images fit the context window; verified and enabled for live calls."
