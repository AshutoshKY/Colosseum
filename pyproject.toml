[project]
name = "colosseum"
version = "0.1.0"
description = "Colosseum — a model-agnostic LLM benchmark platform for health-claims document processing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Colosseum" }]

dependencies = [
    # --- web / config ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # --- storage ---
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # --- model transport / structured output ---
    "litellm>=1.55",
    "instructor>=1.7",
    # Vertex AI auth for LiteLLM's vertex_ai route (service-account JSON -> access token).
    "google-auth>=2.35",
    "google-cloud-aiplatform>=1.70",
    # AWS Bedrock support for LiteLLM
    "boto3>=1.34",
    # --- orchestration ---
    "langgraph>=0.2.50",
    # --- document prep toolkit ---
    "pypdf>=5.1",
    "pymupdf>=1.25",
    "pypdfium2>=4.30",
    "Pillow>=11.0",
    # --- misc ---
    "tenacity>=9.0",
    "redis>=5.2",
    # data-driven model catalog (providers/catalog/*.yaml)
    "pyyaml>=6.0",
    # observability
    "langfuse>=2.0",
    # UI
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "openapi-spec-validator>=0.7",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q -m 'not live'"
markers = [
    "live: tests that hit a real provider (require credentials; skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: keep `str, Enum` (portable, explicit) rather than StrEnum for the capability enums.
ignore = ["E501", "UP042"]
